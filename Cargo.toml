[package]
name = "meowsystem-drives"
version = "0.1.3"
edition = "2024"
authors = ["Jonathan Capps (upstream)", "Vitória Maria", "André Farias"]
license = "GPL-3.0-only"
description = "An applet for the COSMIC desktop to manage mounted drives. A fork of cosmic-utils/cosmic-ext-applet-drives themed by MeowSystem."
repository = "https://github.com/vitoriamariadb/meowsystem-drives"

[dependencies]
drives = "0.6.1"
i18n-embed-fl = "0.10.1"
lfs-core = "0.19.3"
log = "0.4"
notify-rust = "4.18.0"
open = "5.4.0"
procfs = "0.18.0"
serde_json = "1"
rust-embed = "8.12.0"
udev = "0.9.3"

[dependencies.i18n-embed]
version = "0.16.0"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["applet", "wayland"]

[features]
flatpak = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
